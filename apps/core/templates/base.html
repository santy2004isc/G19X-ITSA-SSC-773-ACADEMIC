{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ACCN - Consulta Normativa{% endblock %}</title>
    <script>
        (function () {
            try {
                const tema = localStorage.getItem('accn-theme');
                document.documentElement.dataset.theme = tema === 'dark' ? 'dark' : 'light';
            } catch (_) { document.documentElement.dataset.theme = 'light'; }
        })();
    </script>
    <!-- Hoja de Estilos Tailwind CSS Compilada Estáticamente para Producción -->
    <link rel="stylesheet" href="{% static 'css/dist.css' %}">
</head>
<body data-page="{{ request.resolver_match.url_name|default:'' }}" class="bg-slate-50 min-h-screen text-slate-800 flex flex-col font-sans">
   
    {% include 'includes/messages.html' %}

    {% block content %}{% endblock %}

    <!-- Script Global para Mostrar/Ocultar Contraseñas -->
    <script>
        (function () {
            const botonesTema = Array.from(document.querySelectorAll('[data-theme-toggle], #themeToggle'));
            const actualizarTema = function (tema) {
                const oscuro = tema === 'dark';
                document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
                botonesTema.forEach(function (botonTema) {
                    botonTema.textContent = oscuro ? 'Tema claro' : 'Tema oscuro';
                    botonTema.setAttribute('aria-label', oscuro ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
                    botonTema.setAttribute('aria-pressed', String(oscuro));
                });
            };
            actualizarTema(document.documentElement.dataset.theme);
            botonesTema.forEach(function (botonTema) {
                botonTema.addEventListener('click', function () {
                    const tema = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
                    actualizarTema(tema);
                    try { localStorage.setItem('accn-theme', tema); } catch (_) { /* El tema sigue activo durante esta visita. */ }
                });
            });
        })();

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const iconEye = btn.querySelector('.icon-eye');
            const iconEyeOff = btn.querySelector('.icon-eye-off');

            if (input.type === 'password') {
                input.type = 'text';
                if (iconEye) iconEye.classList.add('hidden');
                if (iconEyeOff) iconEyeOff.classList.remove('hidden');
            } else {
                input.type = 'password';
                if (iconEye) iconEye.classList.remove('hidden');
                if (iconEyeOff) iconEyeOff.classList.add('hidden');
            }
        }

        (function () {
            const policyInputs = Array.from(document.querySelectorAll('[data-password-policy]'));
            const matchingInputs = Array.from(document.querySelectorAll('[data-password-match]'));
            const feedback = new Map();

            function addFeedback(input) {
                const message = document.createElement('p');
                message.className = 'password-feedback mt-1 text-xs text-slate-500';
                message.setAttribute('aria-live', 'polite');
                message.id = input.id + '_feedback';
                input.setAttribute('aria-describedby', message.id);
                const anchor = input.closest('.relative') || input;
                anchor.insertAdjacentElement('afterend', message);
                feedback.set(input, message);
            }

            function validatePolicy(input) {
                const value = input.value;
                const optionalEmpty = !input.required && !value;
                const issues = [];
                if (value && value.length < 8) issues.push('8 caracteres');
                if (value && !/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/.test(value)) issues.push('una letra');
                if (value && !/[0-9]/.test(value)) issues.push('un número');
                if (value && !/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9]/.test(value)) issues.push('un carácter especial');
                const error = issues.length ? 'Debe incluir ' + issues.join(', ') + '.' : '';
                input.setCustomValidity(error);
                if (feedback.has(input)) {
                    feedback.get(input).textContent = optionalEmpty
                        ? 'Opcional. Si la cambias, usa 8 caracteres, una letra, un número y un carácter especial.'
                        : error || (value ? 'La contraseña cumple los requisitos.' : 'Usa 8 caracteres, una letra, un número y un carácter especial.');
                    feedback.get(input).classList.toggle('text-red-600', Boolean(error));
                    feedback.get(input).classList.toggle('text-emerald-600', !error && Boolean(value));
                }
                return !error;
            }

            function validateMatch(input) {
                const original = document.getElementById(input.dataset.passwordMatch);
                if (!original) return;
                const mismatch = Boolean(input.value) && input.value !== original.value;
                input.setCustomValidity(mismatch ? 'Las contraseñas no coinciden.' : '');
                if (feedback.has(input)) {
                    feedback.get(input).textContent = mismatch ? 'Las contraseñas no coinciden.' : '';
                    feedback.get(input).classList.toggle('text-red-600', mismatch);
                }
            }

            policyInputs.forEach(addFeedback);
            matchingInputs.forEach(addFeedback);
            policyInputs.forEach(function (input) {
                input.addEventListener('input', function () {
                    validatePolicy(input);
                    matchingInputs.forEach(validateMatch);
                });
                validatePolicy(input);
            });
            matchingInputs.forEach(function (input) {
                input.addEventListener('input', function () { validateMatch(input); });
                const original = document.getElementById(input.dataset.passwordMatch);
                if (original) original.addEventListener('input', function () { validateMatch(input); });
                validateMatch(input);
            });
        })();
    </script>
</body>
</html>
