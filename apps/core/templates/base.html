{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ACCN - Consulta Normativa{% endblock %}</title>
    <script>
        (function () {
            try {
                const tema = localStorage.getItem('accn-theme');
                document.documentElement.dataset.theme = tema === 'dark' ? 'dark' : 'light';
            } catch (_) { document.documentElement.dataset.theme = 'light'; }
        })();
    </script>
    <!-- Hoja de Estilos Tailwind CSS Compilada Estáticamente para Producción -->
    <link rel="stylesheet" href="{% static 'css/dist.css' %}">
</head>
<body data-page="{{ request.resolver_match.url_name|default:'' }}" class="bg-slate-50 min-h-screen text-slate-800 flex flex-col font-sans">
    <button id="themeToggle" type="button" class="theme-toggle" aria-label="Cambiar a tema oscuro" aria-pressed="false" title="Cambiar tema">Tema oscuro</button>
    
    <!-- Contenedor de Mensajes/Notificaciones -->
    {% if messages %}
    <div id="messages-container" class="max-w-2xl mx-auto mt-4 w-full px-4 transition-opacity duration-500" aria-live="polite" aria-atomic="false">
        {% for message in messages %}
        <div role="alert" class="p-4 mb-2 text-sm rounded-lg border shadow-sm break-words {% if 'error' in message.tags %}bg-red-50 text-red-800 border-red-300{% elif 'success' in message.tags %}bg-emerald-50 text-emerald-800 border-emerald-300{% elif 'warning' in message.tags %}bg-amber-50 text-amber-900 border-amber-300{% else %}bg-blue-50 text-blue-800 border-blue-300{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>

    <script>
        setTimeout(function() {
            const container = document.getElementById('messages-container');
            if (container) {
                // Inicia la transición de desvanecimiento (fade out)
                container.style.opacity = '0';
                
                // Elimina el elemento por completo del DOM tras terminar la animación
                setTimeout(function() {
                    container.remove();
                }, 500); // 500ms coincide con duration-500 de Tailwind
            }
        }, 8000);
    </script>
    {% endif %}

    {% block content %}{% endblock %}

    <!-- Script Global para Mostrar/Ocultar Contraseñas -->
    <script>
        (function () {
            const botonTema = document.getElementById('themeToggle');
            const actualizarTema = function (tema) {
                const oscuro = tema === 'dark';
                document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
                botonTema.textContent = oscuro ? 'Tema claro' : 'Tema oscuro';
                botonTema.setAttribute('aria-label', oscuro ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
                botonTema.setAttribute('aria-pressed', String(oscuro));
            };
            actualizarTema(document.documentElement.dataset.theme);
            botonTema.addEventListener('click', function () {
                const tema = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
                actualizarTema(tema);
                try { localStorage.setItem('accn-theme', tema); } catch (_) { /* El tema sigue activo durante esta visita. */ }
            });
        })();

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const iconEye = btn.querySelector('.icon-eye');
            const iconEyeOff = btn.querySelector('.icon-eye-off');

            if (input.type === 'password') {
                input.type = 'text';
                iconEye.classList.add('hidden');
                iconEyeOff.classList.remove('hidden');
            } else {
                input.type = 'password';
                iconEye.classList.remove('hidden');
                iconEyeOff.classList.add('hidden');
            }
        }
      
    </script>
</body>
</html>
