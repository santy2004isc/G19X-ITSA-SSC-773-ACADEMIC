{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ACCN - Consulta Normativa{% endblock %}</title>
    <!-- Hoja de Estilos Tailwind CSS Compilada Estáticamente para Producción -->
    <link rel="stylesheet" href="{% static 'css/dist.css' %}">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col font-sans">
    
    <!-- Contenedor de Mensajes/Notificaciones -->
    {% if messages %}
    <div id="messages-container" class="max-w-md mx-auto mt-4 w-full px-4 transition-opacity duration-500">
        {% for message in messages %}
        <div class="p-4 mb-2 text-sm rounded-lg border shadow-sm {% if message.tags == 'error' %}bg-red-50 text-red-700 border-red-200{% else %}bg-blue-50 text-blue-700 border-blue-200{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>

    <script>
        setTimeout(function() {
            const container = document.getElementById('messages-container');
            if (container) {
                // Inicia la transición de desvanecimiento (fade out)
                container.style.opacity = '0';
                
                // Elimina el elemento por completo del DOM tras terminar la animación
                setTimeout(function() {
                    container.remove();
                }, 500); // 500ms coincide con duration-500 de Tailwind
            }
        }, 8000);
    </script>
    {% endif %}

    {% block content %}{% endblock %}

    <!-- Script Global para Mostrar/Ocultar Contraseñas -->
    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const iconEye = btn.querySelector('.icon-eye');
            const iconEyeOff = btn.querySelector('.icon-eye-off');

            if (input.type === 'password') {
                input.type = 'text';
                iconEye.classList.add('hidden');
                iconEyeOff.classList.remove('hidden');
            } else {
                input.type = 'password';
                iconEye.classList.remove('hidden');
                iconEyeOff.classList.add('hidden');
            }
        }
      
    </script>
</body>
</html>
